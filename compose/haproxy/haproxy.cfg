global
    log stdout format raw local0 info
    maxconn 4000
    # Runtime API. The upgrade orchestrator drives server states over this rather
    # than rewriting config and reloading, so the proxy process is never replaced
    # during an upgrade and established connections are never disturbed.
    stats socket ipv4@0.0.0.0:9999 level admin expose-fd listeners
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull

    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # Subscriptions are long-lived websockets. Without this they would be cut at
    # the client/server timeout, which would look exactly like upgrade damage.
    timeout tunnel  1h

    # Close the server-side connection after each response while keeping
    # client-side keep-alive. Without this, backend connections are pooled and a
    # drained server keeps serving over them, so `drain` would not actually move
    # traffic and waitDrained would be measuring nothing.
    option  http-server-close

    retries 3
    # ONLY conn-failure. That case fires when the connection never established,
    # so the request provably never reached Hasura and replaying it is safe.
    # Broader conditions such as empty-response could double-apply a mutation,
    # and every GraphQL call here is a POST.
    retry-on conn-failure
    option  redispatch

# Docker's embedded DNS. Needed because hasura-green does not exist when the
# stack first comes up (it sits behind a compose profile); without periodic
# re-resolution HAProxy would resolve once at boot, fail, and never find green.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid   5s
    hold other   5s
    hold refused 5s
    hold nx      5s
    hold timeout 5s

frontend fe_hasura
    bind *:8080
    default_backend be_hasura

backend be_hasura
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200

    # init-addr last,libc,none lets HAProxy start even when a backend hostname
    # cannot be resolved yet, instead of refusing to boot.
    server blue  hasura-blue:8080  check inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server green hasura-green:8080 check inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none disabled

frontend fe_stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 2s
